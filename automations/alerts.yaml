- id: alert_cottage_ipad_battery_low
  alias: Alert - cottage-ipad Battery Low
  mode: single
  trigger:
  - platform: numeric_state
    entity_id: sensor.cottage_ipad_battery_level
    below: 30
    for: { minutes: 5 }
  action:
  - action: notify.default
    data:
      title: iPad is low 🪫
      message: Please charge the Cottage iPad 🔌
