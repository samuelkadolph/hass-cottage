- binary_sensor:
  - unique_id: living_room_tv_state
    name: Living Room TV State
    icon: '{{ iif(this.state == "on", "mdi:television", "mdi:television-off") }}'
    state: '{{ this.attributes.activity_raw not in ["power_off", "unavailable", "unknown"] }}'
    attributes:
      activity: '{{ (this.attributes.activity_raw | default("")) | replace("power_off", "Off") }}'
      activity_raw: '{{ states("select.living_room_activities") }}'
      volume: '{% if(this.attributes.volume_raw is not none) %}{{ (this.attributes.volume_raw * 100) | round }}{% endif %}'
      volume_raw: '{{ state_attr("media_player.living_room", "volume_level") }}'
      volume_min: 1
      volume_max: 98

  - unique_id: master_bedroom_tv_state
    name: Master Bedroom TV State
    icon: '{{ iif(this.state == "on", "mdi:television", "mdi:television-off") }}'
    state: '{{ not is_state("media_player.master_bedroom_tv", ["off", "unavailable"]) }}'
    attributes:
      volume: '{% if(this.attributes.volume_raw) %}{{ (this.attributes.volume_raw * 100) | round }}{% endif %}'
      volume_raw: '{{ state_attr("media_player.master_bedroom_tv", "volume_level") }}'
      volume_min: 1
      volume_max: 100

  - unique_id: sunroom_tv_state
    name: Sunroom TV State
    icon: '{{ iif(this.state == "on", "mdi:television", "mdi:television-off") }}'
    state: '{{ this.attributes.activity_raw not in ["power_off", "unavailable", "unknown"] }}'
    attributes:
      activity: '{{ (this.attributes.activity_raw | default("")) | replace("power_off", "Off") }}'
      activity_raw: '{{ states("select.sunroom_activities") }}'
      volume: '{% if(this.attributes.volume_raw) %}{{ (this.attributes.volume_raw * 100) | round }}{% endif %}'
      volume_raw: '{{ state_attr("media_player.sunroom_tv", "volume_level") }}'
      volume_min: 1
      volume_max: 100

- light:
  - unique_id: living_room_tv
    name: Living Room TV
    icon: '{{ iif(this.state == "on", "mdi:television", "mdi:television-off") }}'
    state: '{{ not is_state("select.living_room_activities", ["power_off", "unavailable", "unknown"]) }}'
    level: '{{ (state_attr("media_player.living_room", "volume_level") | default(0.0, true) * 255) | round }}'
    turn_on:
    - action: select.select_option
      target: { entity_id: select.living_room_activities }
      data: { option: Watch Shield }
    turn_off:
    - action: select.select_option
      target: { entity_id: select.living_room_activities }
      data: { option: power_off }
    set_level:
    - action: media_player.volume_set
      target: { entity_id: media_player.living_room }
      data: { volume_level: '{{ brightness / 255 }}' }

  - unique_id: master_bedroom_tv
    name: Master Bedroom TV
    icon: '{{ iif(this.state == "on", "mdi:television", "mdi:television-off") }}'
    state: '{{ not is_state("media_player.master_bedroom_tv", ["off", "unavailable"]) }}'
    level: '{{ (state_attr("media_player.master_bedroom_tv", "volume_level") | default(0.0, true) * 255) | round }}'
    turn_on:
    - action: media_player.turn_on
      target: { entity_id: media_player.master_bedroom_tv }
    turn_off:
    - action: media_player.turn_off
      target: { entity_id: media_player.master_bedroom_tv }
    set_level:
    - action: media_player.volume_set
      target: { entity_id: media_player.master_bedroom_tv }
      data: { volume_level: '{{ brightness / 255 }}' }

  - unique_id: sunroom_tv
    name: Sunroom TV
    icon: '{{ iif(this.state == "on", "mdi:television", "mdi:television-off") }}'
    state: '{{ not is_state("select.sunroom_activities", ["power_off", "unavailable", "unknown"]) }}'
    level: '{{ (state_attr("media_player.sunroom_tv", "volume_level") | default(0.0, true) * 255) | round }}'
    turn_on:
    - action: select.select_option
      target: { entity_id: select.sunroom_activities }
      data: { option: Watch Shield }
    turn_off:
    - action: select.select_option
      target: { entity_id: select.sunroom_activities }
      data: { option: power_off }
    set_level:
    - action: media_player.volume_set
      target: { entity_id: media_player.sunroom_tv }
      data: { volume_level: '{{ brightness / 255 }}' }
